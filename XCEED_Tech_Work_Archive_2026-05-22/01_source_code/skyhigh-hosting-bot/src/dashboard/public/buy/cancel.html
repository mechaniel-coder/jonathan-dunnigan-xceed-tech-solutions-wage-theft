<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Cancelled — Skyhigh Hosting</title>
  <style>
    :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --accent: #00AAFF; --text: #e6edf3; --danger: #f85149; --muted: #8b949e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--danger); border-radius: 12px; padding: 48px 40px; text-align: center; max-width: 440px; width: 100%; }
    .icon { font-size: 3.5rem; margin-bottom: 20px; }
    h1 { font-size: 1.6rem; margin-bottom: 10px; color: var(--danger); }
    p { color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
    a { display: inline-block; padding: 10px 24px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 7px; font-weight: 600; font-size: 0.9rem; }
    a:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">❌</div>
    <h1>Payment Cancelled</h1>
    <p>Your payment was cancelled and you have not been charged. You can try again at any time.</p>
    <a href="/buy/">Back to Coin Store</a>
  </div>
</body>
</html>
